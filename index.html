<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Sumber Ajaran Gereja</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* --- GLOBAL ANIMATIONS --- */
        @keyframes rain-fall {
            0% { transform: translateY(-100vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .rain-drop {
            animation: rain-fall linear infinite;
        }

        @keyframes sink {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            50% { transform: translateY(20px) scale(0.8) rotate(15deg); opacity: 0.8; }
            100% { transform: translateY(50px) scale(0.5) rotate(45deg); opacity: 0; }
        }
        .sink-anim {
            animation: sink 1.5s forwards ease-in;
        }

        @keyframes water-flow {
            0% { background-position: 0px 0px; }
            100% { background-position: 0px 100px; }
        }
        .water-anim {
            background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 15px, transparent 15px, transparent 30px);
            background-size: 100% 100px;
            animation: water-flow 1.5s linear infinite;
        }

        @keyframes custom-bounce {
            0%, 100% { transform: translateY(-15%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0,0,0.2,1); }
        }
        .animate-bounce-slow {
            animation: custom-bounce 2s infinite;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans overflow-hidden select-none">
    
    <!-- Wadah Aplikasi -->
    <div id="app" class="h-screen w-screen flex flex-col"></div>

    <script>
        // --- DATABASE SOAL KITAB SUCI ---
        const QUESTIONS = [
            { q: "Wewenang mengajar secara resmi dalam Gereja Katolik yang dipegang oleh Paus dan para uskup disebut...", correct: "Magisterium", wrong: ["Tradisi Suci", "Hierarki", "Konsili", "Kuria"] },
            { q: "Penerusan sabda Allah yang dipercayakan Kristus kepada para rasul dan penggantinya di bawah bimbingan Roh Kudus disebut...", correct: "Tradisi Suci", wrong: ["Magisterium", "Kitab Suci", "Liturgi", "Dogma"] },
            { q: "Menurut ajaran Gereja Katolik, Wahyu Ilahi bersumber dari satu sumber Ilahi yang mengalir melalui dua saluran, yaitu...", correct: "Kitab Suci & Tradisi", wrong: ["Alkitab & Rosario", "Injil & Surat Rasul", "Magisterium & Hierarki", "Konsili & Paus"] },
            { q: "Sifat tidak dapat sesat yang dimiliki Paus saat mengajarkan iman dan moral secara ex cathedra disebut karunia...", correct: "Infallibilitas", wrong: ["Kudus", "Apostolik", "Universal", "Paripurna"] },
            { q: "Kata 'Alkitab' berasal dari bahasa Arab 'Al-Kutub' yang memiliki arti...", correct: "Buku-buku", wrong: ["Firman Ilahi", "Tulisan Suci", "Sabda Tuhan", "Hukum Taurat"] },
            { q: "Siapakah yang memiliki wewenang untuk menafsirkan Kitab Suci dan Tradisi Suci secara otentik?", correct: "Magisterium", wrong: ["Semua Umat", "Para Teolog", "Ahli Kitab Suci", "Dewan Paroki"] },
            { q: "Jumlah keseluruhan kitab dalam Alkitab Katolik (PL dan PB) adalah...", correct: "73 Kitab", wrong: ["66 Kitab", "39 Kitab", "46 Kitab", "27 Kitab"] },
            { q: "Kumpulan para uskup di seluruh dunia yang dipimpin oleh Paus disebut...", correct: "Dewan Para Uskup", wrong: ["Sinode Keuskupan", "Kuria Roma", "Dewan Paroki", "Konferensi Waligereja"] },
            { q: "Salah satu contoh bentuk wujud Tradisi Suci awal yang berisi rumusan pengakuan iman adalah...", correct: "Syahadat (Credo)", wrong: ["Injil Lukas", "Surat Gembala", "Ensiklik Paus", "Hukum Taurat"] },
            { q: "Siapakah yang menjadi kepala Magisterium di dunia saat ini?", correct: "Paus", wrong: ["Kardinal", "Uskup Agung", "Imam Kepala", "Diakon"] },
            { q: "Bagian dari Alkitab yang menceritakan kehidupan, ajaran, wafat, dan kebangkitan Yesus Kristus adalah...", correct: "Injil", wrong: ["Taurat", "Mazmur", "Kitab Nabi-nabi", "Wahyu"] },
            { q: "Surat resmi yang ditulis oleh Paus untuk seluruh Gereja mengenai ajaran moral atau sosial disebut...", correct: "Ensiklik", wrong: ["Dogma", "Konsili", "Syahadat", "Dekrit"] },
            { q: "Kata Tradisi (Latin: Tradere) secara harfiah memiliki arti...", correct: "Meneruskan", wrong: ["Menuliskan", "Menyanyikan", "Menghafalkan", "Mengkhotbahkan"] },
            { q: "Terjemahan Alkitab ke dalam bahasa Latin yang disusun oleh Santo Hieronimus disebut...", correct: "Vulgata", wrong: ["Septuaginta", "Peshitta", "Targum", "Koptik"] },
            { q: "Konsili Ekumenis terakhir yang membawa pembaruan besar dalam Gereja Katolik di era modern adalah...", correct: "Konsili Vatikan II", wrong: ["Konsili Trente", "Konsili Nicea", "Konsili Vatikan I", "Konsili Efesus"] }
        ];

        // --- UTILITIES & SYSTEM ---
        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        let audioEnabled = true;
        let isFullscreen = false;
        let currentMode = 'menu'; // menu, solo, duel, squad
        let players = [];

        function playSound(type) {
            if (!audioEnabled) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'splash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } else if (type === 'warning') {
                // Suara bip saat waktu tersisa 5 detik
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            } else if (type === 'correct') {
                // Suara nada ceria (arpeggio) saat jawaban benar
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            }
        }

        // --- HTML ASSETS STRINGS ---
        function generateRainHTML() {
            let html = '';
            for(let i=0; i<30; i++) {
                html += `<div class="absolute bg-blue-200 opacity-60 rain-drop" style="left: ${Math.random() * 100}%; top: -20px; width: 2px; height: ${Math.random() * 15 + 10}px; animation-delay: ${Math.random() * 2}s; animation-duration: ${Math.random() * 0.5 + 0.5}s"></div>`;
            }
            return html;
        }

        const DitchBankEffectHTML = `
            <div class="absolute bottom-0 left-0 w-full h-20 md:h-28 pointer-events-none z-30 flex flex-col justify-end">
                <div class="relative h-12 md:h-16 w-full translate-y-1">
                    <svg width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 100 100" class="absolute bottom-0 left-0 fill-green-700 opacity-90 transform -scale-x-100">
                        <path d="M0,100 L3,50 L7,100 L11,30 L15,100 L20,60 L24,100 L29,20 L34,100 L40,40 L45,100 L50,70 L55,100 L62,30 L68,100 L74,15 L80,100 L86,50 L92,100 L97,30 L100,100 Z" />
                    </svg>
                    <svg width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 100 100" class="absolute bottom-0 left-0 fill-green-600">
                        <path d="M0,100 L2,40 L5,100 L8,20 L12,100 L16,50 L20,100 L25,10 L30,100 L35,30 L40,100 L45,60 L50,100 L55,20 L60,100 L65,10 L70,100 L75,40 L80,100 L85,20 L90,100 L95,50 L100,100 Z" />
                    </svg>
                </div>
                <div class="w-full h-8 md:h-12 bg-[#5c3a21] border-t-[3px] border-green-800 relative shadow-[inset_0_5px_10px_rgba(0,0,0,0.3)] overflow-hidden">
                    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#291508_2px,_transparent_2px)] bg-[size:12px_12px]"></div>
                </div>
            </div>
        `;

        const BibleSVGHTML = `
            <div class="relative w-40 h-40 lg:w-64 lg:h-64 mb-2 z-10 animate-bounce-slow drop-shadow-2xl">
                <svg viewBox="0 0 100 100" class="w-full h-full">
                    <circle cx="50" cy="50" r="35" fill="#fef08a" class="animate-pulse" opacity="0.3" />
                    <circle cx="50" cy="50" r="25" fill="#fde047" opacity="0.5" />
                    <path d="M 30 20 L 40 15 L 40 75 L 30 80 Z" fill="#451a03" />
                    <path d="M 40 15 L 80 25 L 80 85 L 40 75 Z" fill="#78350f" />
                    <path d="M 30 80 L 40 75 L 80 85 L 70 90 Z" fill="#fef3c7" />
                    <path d="M 30 35 L 40 30 M 30 50 L 40 45 M 30 65 L 40 60" stroke="#b45309" stroke-width="2" />
                    <line x1="60" y1="35" x2="60" y2="65" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
                    <line x1="50" y1="45" x2="70" y2="50" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />
                    <path d="M 65 81 L 67 96 L 72 92 L 77 98 L 75 83 Z" fill="#dc2626" />
                </svg>
            </div>
        `;

        // --- GAME LOGIC (CLASS) ---
        class PlayerBoard {
            constructor(id, mode) {
                this.id = id;
                this.mode = mode; // solo, duel, squad
                this.timerInterval = null;
                this.timeLeft = 25;
                this.container = document.createElement('div');
                this.container.className = "relative w-full h-full flex flex-col items-center overflow-hidden bg-gradient-to-r from-teal-950 via-teal-600 to-teal-950 border-2 border-teal-900 rounded-xl shadow-[inset_0_0_20px_rgba(0,0,0,0.5)]";
                
                this.buildDOM();
                this.initGame();
            }

            destroy() {
                clearInterval(this.timerInterval);
            }

            buildDOM() {
                const isSquad = this.mode === 'squad';
                const isDuel = this.mode === 'duel';

                this.container.innerHTML = `
                    <!-- Air Parit -->
                    <div class="absolute inset-0 opacity-30 water-anim pointer-events-none mix-blend-overlay"></div>
                    
                    <!-- Header -->
                    <div class="z-10 w-full p-2 md:p-4 flex justify-between items-center bg-black/50 text-white backdrop-blur-sm border-b border-white/10 relative">
                        <div class="ref-timer-bar absolute bottom-0 left-0 h-1 bg-green-400 transition-all duration-1000 ease-linear" style="width: 100%;"></div>
                        
                        <div class="flex flex-col">
                            <div class="font-bold ${isSquad ? 'text-xs' : 'text-sm md:text-lg'}">Player ${this.id}</div>
                            <div class="text-xs tracking-widest mt-0.5 ${isSquad ? 'text-[8px]' : ''}"><span class="ref-lives"></span></div>
                            <div class="text-teal-200 font-semibold tracking-wide ${isSquad ? 'text-[8px] mt-0' : 'text-[10px] md:text-xs mt-0.5'}">Sisa Soal: <span class="ref-qcounter"></span></div>
                        </div>

                        <!-- Indikator Waktu -->
                        <div class="absolute left-1/2 transform -translate-x-1/2 flex flex-col items-center">
                            <span class="ref-timer font-mono font-black ${isSquad ? 'text-sm' : 'text-xl md:text-2xl'} drop-shadow-[0_0_5px_rgba(255,255,255,0.5)] transition-colors">25</span>
                        </div>

                        <div class="flex gap-2 md:gap-4 items-center">
                            <span class="ref-combo text-yellow-300 font-bold animate-pulse ${isSquad ? 'text-[10px]' : 'text-xs md:text-sm'}"></span>
                            <div class="font-bold text-green-300 ${isSquad ? 'text-xs' : 'text-sm md:text-xl'}">Skor: <span class="ref-score">0</span></div>
                        </div>
                    </div>

                    <!-- Layar Game Over -->
                    <div class="ref-gameover z-30 flex-1 flex flex-col items-center justify-center text-white p-4 text-center hidden">
                        <div class="ref-gameover-icon ${isSquad ? 'text-4xl' : 'text-6xl'} mb-4">💦🐸💦</div>
                        <h2 class="ref-gameover-title ${isSquad ? 'text-lg' : 'text-3xl'} font-black mb-2 text-red-400 drop-shadow-md">Yahh, Tenggelam!</h2>
                        <p class="${isSquad ? 'text-sm' : 'text-xl'} mb-4 md:mb-6">Skor Akhir: <span class="ref-final-score text-green-300 font-bold"></span></p>
                        <button class="ref-btn-restart flex items-center gap-2 bg-green-500 hover:bg-green-400 text-white rounded-full font-bold shadow-lg transform transition active:scale-95 ${isSquad ? 'px-4 py-2 text-xs' : 'px-6 py-3'}">
                            <i data-lucide="rotate-ccw" class="${isSquad ? 'w-4 h-4' : 'w-5 h-5'}"></i> Main Lagi
                        </button>
                    </div>

                    <!-- Area Permainan -->
                    <div class="ref-gamearea flex-1 w-full flex flex-col p-2 md:p-4 max-w-md mx-auto relative">
                        <div class="ref-qbox z-10 bg-white/90 backdrop-blur text-teal-900 rounded-2xl shadow-xl text-center transition-all duration-500 border-b-4 border-teal-200 ${isSquad ? 'p-2 mb-2' : 'p-3 mb-3 md:p-4 md:mb-5'}">
                            <h3 class="ref-qtext font-bold leading-tight ${isSquad ? 'text-xs' : 'text-sm md:text-lg'}"></h3>
                        </div>

                        <div class="ref-options flex-1 flex flex-col justify-center relative z-10 transition-all duration-500 ${isSquad ? 'gap-1.5' : 'gap-1.5 md:gap-2.5'}">
                            <!-- Buttons -->
                        </div>

                        <!-- Karakter & Percikan Air -->
                        <div class="relative shrink-0 w-full mt-auto flex items-end justify-center pointer-events-none z-20 ${isSquad ? 'h-20 mb-12 md:mb-16' : 'h-32 md:h-40 mb-28 md:mb-36'}">
                            <div class="ref-frog absolute transition-all duration-500 origin-bottom ${isSquad ? 'text-4xl' : 'text-7xl md:text-[6rem]'}">🐸</div>
                            <div class="ref-splash absolute bottom-0 flex items-center justify-center z-30 ${isSquad ? 'w-16 h-16' : 'w-32 h-32'} hidden">
                                <div class="absolute w-full h-full border-4 border-white rounded-full animate-ping opacity-0"></div>
                                <div class="absolute w-1/2 h-1/2 bg-white rounded-full animate-pulse opacity-50 blur-sm"></div>
                            </div>
                        </div>
                    </div>

                    <div class="ref-rain absolute inset-0 pointer-events-none overflow-hidden z-20 hidden">
                        ${generateRainHTML()}
                    </div>

                    ${DitchBankEffectHTML}
                `;

                this.refs = {
                    lives: this.container.querySelector('.ref-lives'),
                    qCounter: this.container.querySelector('.ref-qcounter'),
                    combo: this.container.querySelector('.ref-combo'),
                    score: this.container.querySelector('.ref-score'),
                    timer: this.container.querySelector('.ref-timer'),
                    timerBar: this.container.querySelector('.ref-timer-bar'),
                    gameOver: this.container.querySelector('.ref-gameover'),
                    gameOverIcon: this.container.querySelector('.ref-gameover-icon'),
                    gameOverTitle: this.container.querySelector('.ref-gameover-title'),
                    finalScore: this.container.querySelector('.ref-final-score'),
                    btnRestart: this.container.querySelector('.ref-btn-restart'),
                    gameArea: this.container.querySelector('.ref-gamearea'),
                    qBox: this.container.querySelector('.ref-qbox'),
                    qText: this.container.querySelector('.ref-qtext'),
                    optionsBox: this.container.querySelector('.ref-options'),
                    frog: this.container.querySelector('.ref-frog'),
                    splash: this.container.querySelector('.ref-splash'),
                    rain: this.container.querySelector('.ref-rain')
                };

                this.refs.btnRestart.onclick = () => this.initGame();
            }

            startTimer() {
                clearInterval(this.timerInterval);
                this.timeLeft = 25;
                this.updateTimerUI();
                
                this.timerInterval = setInterval(() => {
                    if (this.gameState !== 'playing') return;
                    this.timeLeft--;
                    this.updateTimerUI();

                    if (this.timeLeft <= 5 && this.timeLeft > 0) {
                        playSound('warning');
                        this.refs.timer.classList.add('text-red-400', 'scale-125');
                        setTimeout(() => this.refs.timer.classList.remove('scale-125'), 300);
                        this.refs.timerBar.classList.replace('bg-green-400', 'bg-red-500');
                    }

                    if (this.timeLeft <= 0) {
                        clearInterval(this.timerInterval);
                        this.handleAnswer(null, true); // Men-trigger kondisi timeout
                    }
                }, 1000);
            }

            updateTimerUI() {
                if(!this.refs.timer) return;
                this.refs.timer.innerText = this.timeLeft;
                const percentage = (this.timeLeft / 25) * 100;
                this.refs.timerBar.style.width = `${percentage}%`;

                // Reset warna bar jika waktu kembali di atas 5 detik
                if (this.timeLeft > 5) {
                    this.refs.timer.classList.remove('text-red-400');
                    if (this.refs.timerBar.classList.contains('bg-red-500')) {
                        this.refs.timerBar.classList.replace('bg-red-500', 'bg-green-400');
                    }
                }
            }

            initGame() {
                this.questions = shuffleArray(QUESTIONS);
                this.currentQIndex = 0;
                this.score = 0;
                this.combo = 0;
                this.lives = 3;
                this.generateOptions();
                this.setState('playing');
                this.updateUI();
                this.startTimer();
            }

            generateOptions() {
                const currentQ = this.questions[this.currentQIndex];
                const allOpts = [currentQ.correct, ...currentQ.wrong];
                this.options = shuffleArray(allOpts);
            }

            setState(newState, isWin = false) {
                this.gameState = newState;
                const isSquad = this.mode === 'squad';

                // Reset all states
                this.refs.gameArea.classList.remove('hidden');
                this.refs.gameOver.classList.add('hidden');
                this.refs.rain.classList.add('hidden');
                this.refs.splash.classList.add('hidden');
                
                this.refs.qBox.className = `ref-qbox z-10 bg-white/90 backdrop-blur text-teal-900 rounded-2xl shadow-xl text-center transition-all duration-500 border-b-4 border-teal-200 ${isSquad ? 'p-2 mb-2' : 'p-3 mb-3 md:p-4 md:mb-5'}`;
                this.refs.optionsBox.className = `ref-options flex-1 flex flex-col justify-center relative z-10 transition-all duration-500 ${isSquad ? 'gap-1.5' : 'gap-1.5 md:gap-2.5'}`;
                this.refs.frog.className = `ref-frog absolute transition-all duration-500 origin-bottom ${isSquad ? 'text-4xl' : 'text-7xl md:text-[6rem]'}`;

                if (newState === 'playing') {
                    this.refs.qBox.classList.add('opacity-100', 'translate-y-0');
                    this.refs.optionsBox.classList.add('translate-y-0', 'opacity-100');
                    this.refs.frog.classList.add(isSquad ? 'bottom-2' : 'bottom-6', isSquad ? 'md:bottom-4' : 'md:bottom-8', 'animate-bounce-slow');
                } else if (newState === 'jumping') {
                    this.refs.qBox.classList.add('opacity-0', '-translate-y-4');
                    this.refs.optionsBox.classList.add('translate-y-full', 'opacity-0');
                    this.refs.frog.classList.add('bottom-[200%]', 'scale-150', 'rotate-12');
                } else if (newState === 'falling') {
                    this.refs.qBox.classList.add('opacity-100', 'translate-y-0');
                    this.refs.optionsBox.classList.add('translate-y-0', 'opacity-100');
                    this.refs.frog.classList.add(isSquad ? '-bottom-10' : '-bottom-24', 'scale-50', 'opacity-0', 'sink-anim');
                    this.refs.splash.classList.remove('hidden');
                } else if (newState === 'gameover') {
                    clearInterval(this.timerInterval); // Hentikan timer
                    this.refs.gameArea.classList.add('hidden');
                    this.refs.gameOver.classList.remove('hidden');
                    this.refs.finalScore.innerText = this.score;
                    
                    if (isWin) {
                        this.refs.rain.classList.add('hidden'); // Matikan efek hujan jika menang
                        this.refs.gameOverIcon.innerText = "🎉🐸🎉";
                        this.refs.gameOverTitle.innerText = "Luar Biasa! Selesai!";
                        this.refs.gameOverTitle.className = `ref-gameover-title ${isSquad ? 'text-lg' : 'text-3xl'} font-black mb-2 text-green-400 drop-shadow-md`;
                    } else {
                        this.refs.rain.classList.remove('hidden'); // Nyalakan efek hujan jika kalah
                        this.refs.gameOverIcon.innerText = "💦🐸💦";
                        this.refs.gameOverTitle.innerText = "Yahh, Tenggelam!";
                        this.refs.gameOverTitle.className = `ref-gameover-title ${isSquad ? 'text-lg' : 'text-3xl'} font-black mb-2 text-red-400 drop-shadow-md`;
                    }
                }
            }

            updateUI() {
                this.refs.lives.innerHTML = '❤️'.repeat(this.lives);
                this.refs.qCounter.innerText = this.questions.length - this.currentQIndex;
                this.refs.score.innerText = this.score;
                this.refs.combo.innerText = this.combo > 1 ? `${this.combo}x Combo!` : '';
                this.refs.qText.innerText = this.questions[this.currentQIndex].q;

                const isSquad = this.mode === 'squad';
                let btnsHTML = '';
                this.options.forEach((opt, idx) => {
                    btnsHTML += `
                        <button data-opt="${opt.replace(/"/g, '&quot;')}" class="answer-btn group relative w-full bg-green-500 hover:bg-green-400 border-green-700 rounded-full text-white font-bold shadow-md transition-transform transform hover:-translate-y-1 active:translate-y-1 active:border-b-0 overflow-hidden ${isSquad ? 'py-1.5 px-2 text-[10px] md:text-xs border-b-2' : 'py-2 px-3 md:py-2.5 md:px-4 text-xs md:text-sm border-b-[3px]'}">
                            <div class="absolute inset-0 bg-green-400 opacity-0 group-hover:opacity-20 rounded-full"></div>
                            <span>${opt}</span>
                        </button>
                    `;
                });
                
                this.refs.optionsBox.innerHTML = btnsHTML;

                // Add event listeners securely
                const buttons = this.refs.optionsBox.querySelectorAll('.answer-btn');
                buttons.forEach((btn, idx) => {
                    btn.onclick = () => {
                        if (this.gameState === 'playing') this.handleAnswer(this.options[idx]);
                    };
                });
            }

            handleAnswer(selectedOption, isTimeout = false) {
                if (this.gameState !== 'playing') return;
                this.gameState = 'waiting'; // Mencegah klik berulang saat animasi
                clearInterval(this.timerInterval); // Hentikan timer sementara

                const correctOpt = this.questions[this.currentQIndex].correct;
                const isCorrect = !isTimeout && (selectedOption === correctOpt);

                // Highlight tombol jawaban
                const buttons = this.refs.optionsBox.querySelectorAll('.answer-btn');
                buttons.forEach(btn => {
                    const optVal = btn.getAttribute('data-opt');
                    if (optVal === correctOpt) {
                        // Jawaban benar disorot warna kuning cerah
                        btn.classList.remove('bg-green-500', 'hover:bg-green-400', 'border-green-700', 'text-white');
                        btn.classList.add('bg-yellow-400', 'border-yellow-600', 'text-yellow-900', 'scale-[1.02]');
                    } else if (!isTimeout && optVal === selectedOption && !isCorrect) {
                        // Jawaban yang salah ditekan disorot merah
                        btn.classList.remove('bg-green-500', 'hover:bg-green-400', 'border-green-700');
                        btn.classList.add('bg-red-500', 'border-red-700');
                    }
                });

                if (isCorrect) {
                    this.setState('jumping');
                    playSound('correct');
                    playSound('jump');
                    this.score += 10 + (this.combo * 5);
                    this.combo += 1;
                    
                    // Update teks skor secara langsung tanpa menimpa sorotan warna tombol
                    this.refs.score.innerText = this.score;
                    this.refs.combo.innerText = this.combo > 1 ? `${this.combo}x Combo!` : '';

                    setTimeout(() => {
                        this.currentQIndex++;
                        if (this.currentQIndex >= this.questions.length) {
                            this.setState('gameover', true); // Pertanyaan habis = Menang
                        } else {
                            this.generateOptions();
                            this.updateUI();
                            this.setState('playing');
                            this.startTimer(); // Memulai timer lagi
                        }
                    }, 600);
                } else {
                    this.lives--;
                    this.combo = 0;
                    
                    // Update UI nyawa & combo langsung
                    this.refs.combo.innerText = '';
                    this.refs.lives.innerHTML = '❤️'.repeat(this.lives);
                    
                    this.setState('falling');
                    playSound('splash');

                    setTimeout(() => {
                        if (this.lives > 0) {
                            // Lanjut ke soal berikutnya jika masih ada nyawa
                            this.currentQIndex++;
                            if (this.currentQIndex >= this.questions.length) {
                                this.setState('gameover', true); // Pertanyaan habis walau sempat salah = Menang
                            } else {
                                this.generateOptions();
                                this.updateUI();
                                this.setState('playing');
                                this.startTimer(); // Memulai timer lagi
                            }
                        } else {
                            // Nyawa habis, tampilkan game over = Kalah
                            this.setState('gameover', false);
                        }
                    }, 2000); // Tahan 2 detik agar pemain sempat membaca jawaban yang benar
                }
            }
        }

        // --- GLOBAL RENDERING ---
        function renderApp() {
            const app = document.getElementById('app');

            if (currentMode === 'menu') {
                app.innerHTML = `
                    <!-- Peringatan Mode Portrait (Khusus HP) -->
                    <div class="portrait:flex landscape:hidden fixed inset-0 z-[100] bg-teal-950 flex-col items-center justify-center text-white p-8 text-center">
                        <div class="text-6xl mb-6 animate-pulse" style="transform: rotate(90deg)">📱</div>
                        <h2 class="text-3xl font-black mb-3 text-green-400">Putar Perangkat!</h2>
                        <p class="text-teal-200 text-lg">Game ini dirancang khusus untuk dimainkan dalam mode <b>Landscape</b> (Mendatar). Silakan putar posisi HP Anda.</p>
                    </div>

                    <!-- Layout Utama Halaman Awal -->
                    <div class="portrait:hidden landscape:flex min-h-screen bg-gradient-to-br from-teal-950 via-teal-900 to-green-950 flex-row items-center justify-between p-6 lg:p-12 relative overflow-hidden font-sans w-full">
                        <div class="absolute inset-0 opacity-30 water-anim pointer-events-none mix-blend-overlay"></div>
                        
                        <div class="absolute top-4 left-4 z-20 text-teal-200/80 font-bold text-sm tracking-wide drop-shadow-md bg-black/40 px-4 py-1.5 rounded-full border border-white/10 backdrop-blur-md">
                            Karya: Andriani
                        </div>

                        <div class="absolute top-4 right-4 flex gap-2 z-20">
                            <button onclick="toggleAudio()" class="p-2 lg:p-3 bg-black/40 hover:bg-black/60 border border-white/10 rounded-full text-white backdrop-blur transition shadow-lg">
                                <i data-lucide="volume-2" class="audio-btn-icon w-5 h-5"></i>
                            </button>
                            <button onclick="toggleFullscreen()" class="p-2 lg:p-3 bg-black/40 hover:bg-black/60 border border-white/10 rounded-full text-white backdrop-blur transition shadow-lg">
                                <i data-lucide="maximize" class="fs-btn-icon w-5 h-5"></i>
                            </button>
                        </div>

                        <!-- KIRI -->
                        <div class="flex-1 h-full flex flex-col items-start justify-center z-10 text-left pl-4 lg:pl-16">
                            ${BibleSVGHTML}
                            <h1 class="text-4xl lg:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-300 via-emerald-400 to-cyan-400 drop-shadow-lg mb-2 leading-tight">
                                LOMPATAN<br /> IMAN
                            </h1>
                            <h2 class="text-xs lg:text-base font-bold text-teal-100 mb-4 tracking-[0.05em] uppercase bg-black/30 inline-block px-3 py-1.5 lg:px-4 lg:py-2 rounded-lg border border-teal-500/30 shadow-lg">
                                Misi Kelas X: <span class="text-green-400">Sumber Ajaran Gereja</span>
                            </h2>
                            <p class="text-teal-200/80 max-w-sm text-xs lg:text-sm leading-relaxed">
                                Selesaikan misi dengan melompat ke jawaban yang tepat seputar Kitab Suci & Tradisi. Awas tercebur!
                            </p>
                        </div>

                        <!-- KANAN -->
                        <div class="flex-1 h-full flex flex-col items-end justify-center z-10 pr-4 lg:pr-16">
                            <div class="bg-black/50 p-4 lg:p-8 rounded-[1.5rem] lg:rounded-[2rem] backdrop-blur-xl shadow-2xl border border-white/10 w-full max-w-[280px] lg:max-w-sm flex flex-col gap-3 relative overflow-hidden">
                                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-green-400 to-transparent opacity-50"></div>
                                <h3 class="text-center text-teal-300 font-bold tracking-widest mb-2 lg:mb-4 text-xs lg:text-sm drop-shadow-md">PILIH MODE MAIN</h3>

                                <button onclick="startGame('solo')" class="group relative flex items-center justify-between bg-gradient-to-r from-green-600 to-emerald-700 hover:from-green-500 hover:to-emerald-600 text-white py-3 px-4 lg:py-4 lg:px-6 rounded-xl lg:rounded-2xl font-bold text-sm lg:text-lg shadow-xl transform transition hover:-translate-y-1 active:scale-95 overflow-hidden border border-green-400/30">
                                    <div class="flex items-center gap-3 z-10">
                                        <div class="bg-black/20 p-1.5 lg:p-2 rounded-lg"><i data-lucide="user" class="w-5 h-5"></i></div>
                                        <span>Solo Mode</span>
                                    </div>
                                    <i data-lucide="play" class="w-4 h-4 z-10 opacity-50 group-hover:opacity-100 transition-opacity"></i>
                                </button>
                                
                                <button onclick="startGame('duel')" class="group relative flex items-center justify-between bg-gradient-to-r from-blue-600 to-cyan-700 hover:from-blue-500 hover:to-cyan-600 text-white py-3 px-4 lg:py-4 lg:px-6 rounded-xl lg:rounded-2xl font-bold text-sm lg:text-lg shadow-xl transform transition hover:-translate-y-1 active:scale-95 overflow-hidden border border-blue-400/30">
                                    <div class="flex items-center gap-3 z-10">
                                        <div class="bg-black/20 p-1.5 lg:p-2 rounded-lg"><i data-lucide="swords" class="w-5 h-5"></i></div>
                                        <span>Duel Mode</span>
                                    </div>
                                    <i data-lucide="play" class="w-4 h-4 z-10 opacity-50 group-hover:opacity-100 transition-opacity"></i>
                                </button>

                                <button onclick="startGame('squad')" class="group relative flex items-center justify-between bg-gradient-to-r from-purple-600 to-pink-700 hover:from-purple-500 hover:to-pink-700 text-white py-3 px-4 lg:py-4 lg:px-6 rounded-xl lg:rounded-2xl font-bold text-sm lg:text-lg shadow-xl transform transition hover:-translate-y-1 active:scale-95 overflow-hidden border border-purple-400/30">
                                    <div class="flex items-center gap-3 z-10">
                                        <div class="bg-black/20 p-1.5 lg:p-2 rounded-lg"><i data-lucide="users" class="w-5 h-5"></i></div>
                                        <span>Squad Mode</span>
                                    </div>
                                    <i data-lucide="play" class="w-4 h-4 z-10 opacity-50 group-hover:opacity-100 transition-opacity"></i>
                                </button>
                            </div>
                        </div>

                        ${DitchBankEffectHTML}
                    </div>
                `;
            } else {
                app.innerHTML = `
                    <div class="h-12 bg-gray-800 text-white flex justify-between items-center px-4 shadow-md z-50 relative shrink-0">
                        <div class="flex items-center gap-4">
                            <button onclick="backToMenu()" class="flex items-center gap-2 hover:text-green-400 transition text-sm font-bold">
                                <i data-lucide="home" class="w-4 h-4"></i> Menu Utama
                            </button>
                            <div class="text-xs text-gray-400 font-semibold hidden md:block border-l border-gray-600 pl-4">Karya: Andriani</div>
                        </div>
                        <div class="font-black text-green-400 tracking-wider hidden md:block absolute left-1/2 transform -translate-x-1/2">LOMPATAN IMAN</div>
                        <div class="flex gap-4">
                            <button onclick="toggleAudio()" class="hover:text-green-400 transition">
                                <i data-lucide="volume-2" class="audio-btn-icon w-5 h-5"></i>
                            </button>
                            <button onclick="toggleFullscreen()" class="hover:text-green-400 transition hidden md:block">
                                <i data-lucide="maximize" class="fs-btn-icon w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                    <div id="game-grid" class="flex-1 w-full p-2 gap-2 bg-black/90 ${
                        currentMode === 'solo' ? 'flex items-center justify-center' :
                        currentMode === 'duel' ? 'grid grid-cols-2' : 'grid grid-cols-4'
                    }"></div>
                `;
                
                const grid = document.getElementById('game-grid');
                players.forEach(p => grid.appendChild(p.container));
            }

            updateIconsState();
            lucide.createIcons();
        }

        // --- EVENT HANDLERS ---
        window.startGame = function(mode) {
            currentMode = mode;
            const count = mode === 'solo' ? 1 : mode === 'duel' ? 2 : 4;
            
            // Build players
            players = [];
            for (let i = 0; i < count; i++) {
                players.push(new PlayerBoard(i + 1, mode));
            }

            // Auto Fullscreen
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(`Auto-fullscreen blocked: ${err.message}`));
                isFullscreen = true;
            }

            renderApp();
        };

        window.backToMenu = function() {
            players.forEach(p => p.destroy()); // Bersihkan memori dan interval timer
            currentMode = 'menu';
            players = []; // clear memory
            renderApp();
        };

        window.toggleAudio = function() {
            audioEnabled = !audioEnabled;
            updateIconsState();
        };

        window.toggleFullscreen = function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                isFullscreen = true;
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    isFullscreen = false;
                }
            }
            updateIconsState();
        };

        function updateIconsState() {
            document.querySelectorAll('.audio-btn-icon').forEach(icon => {
                icon.setAttribute('data-lucide', audioEnabled ? 'volume-2' : 'volume-x');
            });
            document.querySelectorAll('.fs-btn-icon').forEach(icon => {
                icon.setAttribute('data-lucide', isFullscreen ? 'minimize' : 'maximize');
            });
            lucide.createIcons();
        }

        // Initial Load
        window.onload = () => {
            renderApp();
        };
    </script>
</body>
</html>
